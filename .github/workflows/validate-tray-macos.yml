name: Verify Gopeed with Finder
on:
  push:
    branches: [validation/macos-tray-1681]
permissions:
  actions: read
  contents: read
jobs:
  finder:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44898025078
          name: gopeed-macos-a4984bd
      - name: Open the verified app and inspect the tray
        run: |
          ditto -x -k gopeed-macos.zip "$RUNNER_TEMP/ui"
          codesign --verify --deep "$RUNNER_TEMP/ui/Gopeed.app"
          open "$RUNNER_TEMP/ui/Gopeed.app"
          sleep 8
          osascript <<'APPLESCRIPT'
          with timeout of 20 seconds
            tell application "System Events" to tell process "Gopeed"
              log {count of windows, count of menu bars}
              log name of every menu bar item of every menu bar
              if (count of menu bars) < 2 then error "Gopeed status menu unavailable"
              log description of every menu bar item of menu bar 2
              log name of every action of menu bar item 1 of menu bar 2
            end tell
          end timeout
          APPLESCRIPT
